<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List Test</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>Task List Component Test</h1>
        </header>

        <main class="dashboard-main">
            <!-- Task List Component -->
            <section class="component task-component" id="task-list">
                <h2>Task List</h2>
                <div class="task-input-container">
                    <form class="task-form" id="task-form">
                        <input 
                            type="text" 
                            id="task-input" 
                            class="task-input" 
                            placeholder="Add a new task..." 
                            maxlength="500"
                            aria-label="New task text"
                        >
                        <button 
                            type="submit" 
                            class="btn-add-task"
                            aria-label="Add task"
                        >
                            Add Task
                        </button>
                    </form>
                </div>
                <div class="task-list-container">
                    <!-- Sample task items for visual testing -->
                    <div class="task-item" data-task-id="task-1">
                        <input 
                            type="checkbox" 
                            class="task-checkbox" 
                            aria-label="Mark task as complete"
                        >
                        <span class="task-text">Complete project documentation</span>
                        <div class="task-actions">
                            <button class="btn-edit" aria-label="Edit task">Edit</button>
                            <button class="btn-delete" aria-label="Delete task">Delete</button>
                        </div>
                    </div>

                    <div class="task-item completed" data-task-id="task-2">
                        <input 
                            type="checkbox" 
                            class="task-checkbox" 
                            checked
                            aria-label="Mark task as incomplete"
                        >
                        <span class="task-text">Review code changes</span>
                        <div class="task-actions">
                            <button class="btn-edit" aria-label="Edit task">Edit</button>
                            <button class="btn-delete" aria-label="Delete task">Delete</button>
                        </div>
                    </div>

                    <div class="task-item" data-task-id="task-3">
                        <input 
                            type="checkbox" 
                            class="task-checkbox" 
                            aria-label="Mark task as complete"
                        >
                        <span class="task-text">Update dependencies</span>
                        <div class="task-actions">
                            <button class="btn-edit" aria-label="Edit task">Edit</button>
                            <button class="btn-delete" aria-label="Delete task">Delete</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
